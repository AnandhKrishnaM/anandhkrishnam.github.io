{{- with site.Params.giscus }}
{{- if and .repo .repoId .categoryId (ne $.Params.comments false) }}
<section class="comments" aria-label="Comments">
  <script src="https://giscus.app/client.js"
    data-repo="{{ .repo }}" data-repo-id="{{ .repoId }}"
    data-category="{{ .category }}" data-category-id="{{ .categoryId }}"
    data-mapping="pathname" data-strict="1" data-reactions-enabled="1"
    data-emit-metadata="0" data-input-position="top" data-lang="en"
    data-theme="preferred_color_scheme" data-loading="lazy"
    crossorigin="anonymous" async></script>
</section>
{{- end }}
{{- end }}
