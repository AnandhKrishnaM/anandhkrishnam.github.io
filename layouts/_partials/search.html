{{- if site.Params.search.enable }}
<div class="scrim" id="scrim" hidden></div>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search" hidden
     data-index="{{ "search.json" | relURL }}">
  <div class="pal-in">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="pal-input" type="search" placeholder="Search notes, lectures, thoughts…" autocomplete="off" spellcheck="false" aria-controls="pal-list">
    <kbd>Esc</kbd>
  </div>
  <div class="pal-list" id="pal-list" role="listbox"></div>
  <div class="pal-foot">
    <span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span>titles, tags &amp; full text</span>
  </div>
</div>
{{- end }}
